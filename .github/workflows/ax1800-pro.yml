name: AX1800 Pro - official ImmortalWrt plus NSS

on:
  workflow_dispatch:
  push:
    branches: [ax1800-pro-nss]

permissions:
  contents: read

concurrency:
  group: ax1800-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'stevessr/immortalwrt-jdcloud-ax1800-pro'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: /home/runner/.cache/ccache-ax1800
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout official fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare standard hosted runner
        run: |
          set -euxo pipefail
          # These paths belong only to the disposable GitHub hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 llvm-18 llvm-18-dev \
            libclang-18-dev libelf-dev libssl-dev libncurses-dev zlib1g-dev \
            gawk gettext git rsync unzip zstd file wget curl python3 python3-setuptools \
            flex bison swig pkgconf subversion time xsltproc gperf ccache \
            device-tree-compiler u-boot-tools squashfs-tools
          sudo mkdir -p /mnt/ax1800-work
          sudo chown "$USER:$USER" /mnt/ax1800-work
          mkdir -p logs
          df -h
          free -h
      - name: Restore download and compiler caches
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            dl
            /home/runner/.cache/ccache-ax1800
          key: ax1800-downloads-${{ runner.os }}-${{ hashFiles('ci/ax1800-pro/sources.lock.json', 'ci/ax1800-pro/config.seed') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ax1800-downloads-${{ runner.os }}-${{ hashFiles('ci/ax1800-pro/sources.lock.json', 'ci/ax1800-pro/config.seed') }}-
            ax1800-downloads-${{ runner.os }}-
      - name: Prepare pinned feeds and assert configuration
        run: bash ci/ax1800-pro/prepare.sh 2>&1 | tee logs/prepare.log
      - name: Test credential-free first-boot defaults
        run: |
          python3 ci/ax1800-pro/test-defaults.py
          python3 ci/ax1800-pro/test-ci-mtimes.py
      - name: Download verified sources
        run: |
          set -o pipefail
          make download -j8 V=s 2>&1 | tee logs/download.log
      - name: Test patched ECM notifier API and lifetime handling
        run: python3 ci/ax1800-pro/test-ecm-notifier.py
      - name: Normalize immutable checkout timestamps
        run: python3 ci/ax1800-pro/normalize-ci-mtimes.py
      - name: Compute exact compiler cache identities
        id: cache-keys
        run: |
          echo 'toolchain=ax1800-toolchain-v2-ubuntu24-${{ hashFiles('tools/**', 'toolchain/**', 'include/**', 'config/**', 'scripts/**', 'target/linux/generic/**', 'target/linux/qualcommax/**', 'Config.in', 'rules.mk', 'ci/ax1800-pro/config.seed', 'ci/ax1800-pro/normalize-ci-mtimes.py') }}' >> "$GITHUB_OUTPUT"
          echo 'rust=${{ hashFiles('feeds/packages/lang/rust/**') }}' >> "$GITHUB_OUTPUT"
      - name: Restore host tools and cross compiler
        id: toolchain-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build_dir/host
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/toolchain-*
          key: ${{ steps.cache-keys.outputs.toolchain }}
      - name: Build host tools and cross compiler
        run: |
          set -o pipefail
          make tools/install -j4 V=s 2>&1 | tee logs/tools.log
          make toolchain/install -j4 V=s 2>&1 | tee logs/toolchain.log
      - name: Cache completed cross compiler
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build_dir/host
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/toolchain-*
          key: ${{ steps.cache-keys.outputs.toolchain }}
      - name: Restore completed Rust compiler
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          # Installed compiler plus completed stamps, not its multi-GB object tree.
          # The exact key covers toolchain, target, configuration and Rust recipe.
          path: |
            staging_dir/target-*/host
            staging_dir/hostpkg/stamp/.rust_installed
            build_dir/target-*/host/rustc-*/.prepared*
            build_dir/target-*/host/rustc-*/.configured*
            build_dir/target-*/host/rustc-*/.built*
          key: ${{ steps.cache-keys.outputs.toolchain }}-rust-v1-${{ steps.cache-keys.outputs.rust }}
      - name: Compile firmware
        run: |
          set -o pipefail
          jobs=$(nproc)
          (( jobs <= 4 )) || jobs=4
          make -j"$jobs" V=s 2>&1 | tee logs/build.log || \
            make -j1 V=s 2>&1 | tee logs/build-retry.log
      - name: Check whether Rust completed, even if another package failed
        if: always() && !cancelled()
        id: rust-state
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          compilers=(staging_dir/target-*/host/bin/rustc)
          if [[ -f staging_dir/hostpkg/stamp/.rust_installed && ${#compilers[@]} == 1 ]]; then
            "${compilers[0]}" --version
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Cache completed Rust compiler
        if: always() && steps.rust-state.outputs.complete == 'true' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            staging_dir/target-*/host
            staging_dir/hostpkg/stamp/.rust_installed
            build_dir/target-*/host/rustc-*/.prepared*
            build_dir/target-*/host/rustc-*/.configured*
            build_dir/target-*/host/rustc-*/.built*
          key: ${{ steps.cache-keys.outputs.toolchain }}-rust-v1-${{ steps.cache-keys.outputs.rust }}
      - name: Save downloads and ccache even on package failure
        if: always() && !cancelled() && steps.source-cache.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            dl
            /home/runner/.cache/ccache-ax1800
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - name: Verify image, packages and actual BTF
        run: |
          python3 ci/ax1800-pro/verify-config.py
          python3 ci/ax1800-pro/verify-image.py | tee logs/verification.log
      - name: Upload firmware and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ax1800-pro-${{ github.sha }}
          path: bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload build logs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            .config
          include-hidden-files: true
          retention-days: 14
